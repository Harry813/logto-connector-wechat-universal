<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized WeChat Universal connector configuration walkthrough</title>
  <desc id="desc">A sanitized illustration of the Logto Admin Console configuration fields for WeChat Universal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#475569" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <text x="70" y="62" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">Configuration walkthrough</text>
  <text x="70" y="94" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Logto Admin Console · WeChat Universal · 脱敏配置教程</text>
  <rect x="936" y="48" width="194" height="38" rx="19" fill="#dcfce7"/>
  <text x="1033" y="73" fill="#166534" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">NO REAL SECRETS</text>

  <g filter="url(#shadow)">
    <rect x="55" y="125" width="1090" height="570" rx="20" fill="#fff"/>
  </g>

  <rect x="55" y="125" width="245" height="570" rx="20" fill="#111827"/>
  <path d="M55 145a20 20 0 0 1 20-20h225v570H75a20 20 0 0 1-20-20Z" fill="#111827"/>
  <circle cx="100" cy="174" r="20" fill="#22c55e"/>
  <path d="M90 174c0-5 5-9 11-9s11 4 11 9-5 9-11 9c-2 0-3 0-5-1l-5 3 1-6c-1-1-2-3-2-5Z" fill="#fff"/>
  <text x="132" y="181" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">WeChat Universal</text>
  <text x="86" y="242" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">SIGN-IN &amp; ACCOUNT</text>
  <rect x="75" y="264" width="205" height="44" rx="9" fill="#1e293b"/>
  <circle cx="97" cy="286" r="6" fill="#22c55e"/>
  <text x="116" y="292" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Social sign-in</text>
  <text x="86" y="347" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Branding</text>
  <text x="86" y="388" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Users</text>
  <text x="86" y="429" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Applications</text>
  <rect x="75" y="620" width="205" height="44" rx="9" fill="#172033" stroke="#334155"/>
  <text x="177" y="648" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">Sanitized example</text>

  <text x="350" y="177" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Configure WeChat Universal</text>
  <text x="350" y="204" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Use credentials from two apps bound to the same WeChat Open Platform account.</text>

  <circle cx="353" cy="250" r="17" fill="#2563eb"/>
  <text x="353" y="256" fill="#fff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="385" y="255" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Official Account / 公众号</text>

  <text x="350" y="298" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Official Account App ID</text>
  <rect x="350" y="310" width="350" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="339" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">wx**************01</text>
  <text x="735" y="298" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Official Account App Secret</text>
  <rect x="735" y="310" width="350" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="755" y="339" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">••••••••••••••••</text>

  <circle cx="353" cy="398" r="17" fill="#7c3aed"/>
  <text x="353" y="404" fill="#fff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="385" y="403" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Website App / 网站应用</text>

  <text x="350" y="446" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Website App ID</text>
  <rect x="350" y="458" width="350" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="487" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">wx**************02</text>
  <text x="735" y="446" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Website App Secret</text>
  <rect x="735" y="458" width="350" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="755" y="487" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">••••••••••••••••</text>

  <circle cx="353" cy="547" r="17" fill="#16a34a"/>
  <text x="353" y="553" fill="#fff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="385" y="552" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Routing options / 分流选项</text>

  <text x="350" y="595" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Official Account Scope</text>
  <rect x="350" y="607" width="260" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="636" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">snsapi_userinfo</text>
  <path d="M584 625l7 7 7-7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <text x="640" y="595" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Mobile Fallback URL (optional)</text>
  <rect x="640" y="607" width="445" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="636" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">https://example.com/open-in-wechat</text>

  <rect x="854" y="665" width="231" height="48" rx="10" fill="#2563eb"/>
  <text x="969" y="696" fill="#fff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Save and test / 保存并测试</text>
  <text x="55" y="735" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Illustration based on connector metadata. Labels and layout may vary by Logto version. / 根据 Connector 字段制作，实际界面以当前 Logto 版本为准。</text>
</svg>
