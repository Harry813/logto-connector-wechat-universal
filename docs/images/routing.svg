<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">WeChat Universal Connector routing</title>
  <desc id="desc">WeChat browsers use Official Account H5 OAuth, desktop browsers use Website QR OAuth, and external mobile browsers may use a fallback page. Every successful path requires UnionID.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="150" fill="#22c55e" opacity="0.08"/>
  <circle cx="120" cy="590" r="190" fill="#3b82f6" opacity="0.09"/>

  <text x="600" y="62" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" text-anchor="middle">One entry, three browser paths</text>
  <text x="600" y="96" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">统一微信登录入口 · 根据浏览器环境自动分流</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="310" height="245" rx="22" fill="#ffffff"/>
    <rect x="445" y="145" width="310" height="245" rx="22" fill="#ffffff"/>
    <rect x="820" y="145" width="310" height="245" rx="22" fill="#ffffff"/>
  </g>

  <circle cx="125" cy="200" r="28" fill="#16a34a"/>
  <path d="M112 194c0-6 6-11 14-11s14 5 14 11-6 11-14 11c-2 0-4 0-6-1l-7 4 2-7c-2-2-3-4-3-7Z" fill="#fff"/>
  <text x="168" y="195" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">WeChat Browser</text>
  <text x="168" y="222" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">微信内置浏览器</text>
  <line x1="105" y1="250" x2="345" y2="250" stroke="#e2e8f0"/>
  <text x="225" y="290" fill="#166534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">Official Account H5</text>
  <text x="225" y="322" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">snsapi_userinfo</text>
  <rect x="115" y="345" width="220" height="30" rx="15" fill="#dcfce7"/>
  <text x="225" y="366" fill="#166534" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">公众号网页授权</text>

  <circle cx="500" cy="200" r="28" fill="#2563eb"/>
  <rect x="487" y="187" width="26" height="19" rx="2" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M482 212h36M496 207v5M504 207v5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="543" y="195" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Desktop Browser</text>
  <text x="543" y="222" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">桌面浏览器</text>
  <line x1="480" y1="250" x2="720" y2="250" stroke="#e2e8f0"/>
  <text x="600" y="290" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">Website App QR</text>
  <text x="600" y="322" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">snsapi_login</text>
  <rect x="490" y="345" width="220" height="30" rx="15" fill="#dbeafe"/>
  <text x="600" y="366" fill="#1e40af" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">网站应用扫码登录</text>

  <circle cx="875" cy="200" r="28" fill="#7c3aed"/>
  <rect x="866" y="182" width="18" height="35" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="875" cy="211" r="1.8" fill="#fff"/>
  <text x="918" y="195" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">External Mobile</text>
  <text x="918" y="222" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">微信外手机浏览器</text>
  <line x1="855" y1="250" x2="1095" y2="250" stroke="#e2e8f0"/>
  <text x="975" y="290" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">Fallback Page</text>
  <text x="975" y="322" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">HTTPS only</text>
  <rect x="865" y="345" width="220" height="30" rx="15" fill="#ede9fe"/>
  <text x="975" y="366" fill="#5b21b6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">可选引导页</text>

  <path d="M225 405V445H515" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 405V445" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M975 405V445H685" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="365" y="460" width="470" height="122" rx="22" fill="#f8fafc" stroke="#86efac" stroke-width="3"/>
  </g>
  <circle cx="425" cy="521" r="32" fill="#16a34a"/>
  <path d="M411 521l9 9 20-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="475" y="510" fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">UnionID required</text>
  <text x="475" y="542" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">缺少 unionid 即拒绝登录，不降级使用 openid</text>
  <text x="475" y="568" fill="#166534" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">One WeChat person → one Logto social identity</text>
</svg>
